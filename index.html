<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AGROW — Grow What Matters</title>
<link rel="stylesheet" href="fonts.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; }
  a { color: inherit; text-decoration: none; }
  ::selection { background: #0f251a; color: #fff; }
  button { font-family: inherit; }

  .photo-slot { position: relative; width: 100%; height: 100%; background: linear-gradient(135deg,#16332444,#0f251a); }
  .photo-slot img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photo-slot.img-missing { background: linear-gradient(135deg,#1c3c2c,#0f251a); }
  .photo-slot.img-missing img { display: none; }
  .photo-slot.img-missing::after {
    content: "이미지 준비 중 · " attr(data-label);
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: rgba(255,255,255,.55); font-size: 12px; font-weight: 600; text-align: center; padding: 20px;
    letter-spacing: .02em;
  }

  /* Accessibility: visible keyboard focus on every interactive element */
  a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {
    outline: 2px solid #4f9d7a; outline-offset: 2px; border-radius: 4px;
  }

  /* Touch target minimum 44x44 (nav links, lang pills) */
  .nav-link, .lang-option { min-height: 44px; display: inline-flex; align-items: center; justify-content: center; }

  /* Respect reduced-motion: disable section scroll-jacking + smooth scroll entirely */
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    #root { scroll-snap-type: none; }
    * { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
  }

  /* Scroll-reveal (subtle fade-up, ~standard tier) */
  .reveal { opacity: 0; transform: translateY(20px); transition: opacity .5s ease, transform .5s ease; }
  .reveal.is-visible { opacity: 1; transform: translateY(0); }
  .reveal-stagger > * { opacity: 0; transform: translateY(16px); transition: opacity .45s ease, transform .45s ease; }
  .reveal-stagger.is-visible > * { opacity: 1; transform: translateY(0); }
  .reveal-stagger.is-visible > *:nth-child(1) { transition-delay: 0ms; }
  .reveal-stagger.is-visible > *:nth-child(2) { transition-delay: 70ms; }
  .reveal-stagger.is-visible > *:nth-child(3) { transition-delay: 140ms; }
  .reveal-stagger.is-visible > *:nth-child(4) { transition-delay: 210ms; }
  .reveal-stagger.is-visible > *:nth-child(5) { transition-delay: 280ms; }
  @media (prefers-reduced-motion: reduce) {
    .reveal, .reveal-stagger > * { opacity: 1 !important; transform: none !important; }
  }

  /* Depth: subtle card shadow + hover elevation */
  .depth-card { box-shadow: 0 1px 3px rgba(15,37,26,.05), 0 8px 24px rgba(15,37,26,.06); transition: transform .25s ease, box-shadow .25s ease; }
  .depth-card:hover { transform: translateY(-3px); box-shadow: 0 4px 8px rgba(15,37,26,.07), 0 16px 32px rgba(15,37,26,.1); }
  .solution-card { transition: transform .3s ease, box-shadow .3s ease; }
  .solution-card:hover { transform: translateY(-4px); box-shadow: 0 20px 48px rgba(0,0,0,.35); }

  /* Metric cards (hero) */
  .metric-card { transition: transform .25s ease, background .25s ease, border-color .25s ease; }
  .metric-card:hover { transform: translateY(-2px); background: rgba(255,255,255,.14); border-color: rgba(255,255,255,.35); }

  /* Buttons */
  .btn-primary, .btn-cta { transition: transform .2s ease, box-shadow .2s ease, background .2s ease; }
  .btn-primary:hover, .btn-cta:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(15,37,26,.18); }
  .btn-primary:active, .btn-cta:active { transform: translateY(0); }

  /* Press strip wordmarks */
  .press-mark { color: rgba(15,37,26,.55); font-weight: 700; letter-spacing: .02em; transition: color .2s ease; white-space: nowrap; }
  .press-mark:hover { color: rgba(15,37,26,.75); }

  /* Section dot navigation */
  #dot-nav { position: fixed; right: 22px; top: 50%; transform: translateY(-50%); z-index: 55; display: flex; flex-direction: column; gap: 14px; }
  #dot-nav button { width: 44px; height: 44px; padding: 0; border: none; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  #dot-nav .dot { width: 8px; height: 8px; border-radius: 999px; background: rgba(15,37,26,.25); transition: all .25s ease; }
  #dot-nav button[aria-current="true"] .dot { background: #0f251a; width: 10px; height: 10px; box-shadow: 0 0 0 4px rgba(15,37,26,.12); }
  #dot-nav.on-dark .dot { background: rgba(255,255,255,.35); }
  #dot-nav.on-dark button[aria-current="true"] .dot { background: #fff; box-shadow: 0 0 0 4px rgba(255,255,255,.18); }
  @media (max-width: 900px) { #dot-nav { display: none; } }

  /* Grounded nav bar once the user scrolls past the hero */
  #topbar.scrolled { background: rgba(255,255,255,.72); backdrop-filter: blur(14px); box-shadow: 0 1px 0 rgba(15,37,26,.06), 0 8px 24px rgba(15,37,26,.04); }
  #topbar.scrolled.on-dark { background: rgba(15,37,26,.55); box-shadow: 0 1px 0 rgba(255,255,255,.08), 0 8px 24px rgba(0,0,0,.2); }

  /* Trust badge chips (partnerships, press marks) */
  .trust-chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; background: rgba(15,37,26,.06); border: 1px solid rgba(15,37,26,.12); border-radius: 999px; font-size: 12px; font-weight: 600; color: #0f251a; }
</style>
</head>
<body>
<div id="root" style="font-family:'Pretendard', system-ui, sans-serif;background:radial-gradient(ellipse 80% 60% at 15% 0%, rgba(255,255,255,.9) 0%, rgba(230,235,229,0) 60%), radial-gradient(ellipse 70% 50% at 100% 20%, rgba(212,222,208,.6) 0%, rgba(230,235,229,0) 55%), #e6ebe5;color:#0f251a;overflow-x:hidden;line-height:1.5;word-break:keep-all;overflow-wrap:break-word;height:100vh;height:100dvh;overflow-y:auto;position:relative">

  <!-- ================= SCROLL PROGRESS BAR ================= -->
  <div id="scroll-progress" style="position:fixed;top:0;left:0;height:3px;width:0%;background:#0f251a;z-index:70;transition:width .3s ease,background .3s ease;pointer-events:none"></div>

  <!-- ================= TOP BAR (persistent) ================= -->
  <div id="topbar" style="position:fixed;top:0;left:0;right:0;z-index:60;display:flex;justify-content:space-between;align-items:center;padding:28px 40px;pointer-events:none;transition:background .3s ease,box-shadow .3s ease,backdrop-filter .3s ease">
    <a href="javascript:void(0)" id="logo-link" style="display:block;width:110px;cursor:pointer;pointer-events:auto">
      <img id="logo-img" src="agrow-logo.svg" alt="AGROW" style="width:100%;height:auto;display:block;transition:filter .3s">
    </a>
    <div style="display:flex;align-items:center;gap:24px;pointer-events:auto">
      <nav id="nav-links" aria-label="주 메뉴" style="display:flex;gap:4px"></nav>
      <div style="display:flex;align-items:center;gap:12px">
        <div id="lang-box" role="group" aria-label="언어 선택" style="display:flex;align-items:center;border-radius:999px;padding:4px;transition:background .2s,border-color .2s">
          <div id="lang-options" style="display:flex;gap:4px"></div>
        </div>
        <a href="#contact" class="btn-cta" style="padding:10px 22px;font-size:15px;color:#0f251a;background:#fff;border-radius:999px;font-weight:600;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.15)" data-i18n="nav.contact"></a>
      </div>
    </div>
  </div>

  <!-- ================= SECTION DOT NAVIGATION ================= -->
  <nav id="dot-nav" aria-label="섹션 바로가기"></nav>

  <main>
  <!-- ================= HERO ================= -->
  <section aria-label="AGROW 소개" style="padding:16px;height:100vh;height:100dvh;overflow:hidden;box-sizing:border-box">
    <div style="position:relative;min-height:90vh;border-radius:3rem;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between">
      <div class="photo-slot" data-label="assets/hero-field.jpg" style="position:absolute;inset:0;z-index:0">
        <img src="assets/hero-field.jpg" alt="인도네시아 논 현장" onerror="this.parentElement.classList.add('img-missing')">
      </div>
      <div style="position:absolute;inset:0;background:radial-gradient(ellipse at center, rgba(0,0,0,.25) 0%, rgba(0,0,0,.55) 65%, rgba(0,0,0,.85) 100%), linear-gradient(to bottom, rgba(0,0,0,.5), rgba(0,0,0,.1) 35%, rgba(0,0,0,.8));z-index:1;pointer-events:none"></div>

      <div style="position:relative;z-index:10;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 20px;padding-bottom:80px;pointer-events:none">
        <div style="display:inline-flex;align-items:center;gap:10px;padding:14px 32px;border:1px solid rgba(255,255,255,.3);border-radius:999px;color:rgba(255,255,255,.92);font-size:16px;font-weight:500;margin-bottom:28px;max-width:640px;backdrop-filter:blur(6px);background:rgba(255,255,255,.08);box-shadow:inset 0 0 20px rgba(255,255,255,.08)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex-shrink:0"><path d="M9 12l2 2 4-4"></path><circle cx="12" cy="12" r="9"></circle></svg>
          <span data-i18n="hero.badge"></span>
        </div>
        <h1 style="font-size:clamp(3rem, 7vw, 7rem);font-weight:800;color:#fff;line-height:1.05;letter-spacing:-0.03em;margin:0 0 28px;text-transform:uppercase">Grow What Matters</h1>
        <p style="font-size:clamp(18px,2vw,26px);color:rgba(255,255,255,.85);max-width:640px;margin:0;font-weight:300;line-height:1.6" data-i18n="hero.sub"></p>
      </div>

      <div id="hero-stats" style="position:relative;z-index:10;padding:0 24px 40px;display:flex;flex-wrap:wrap;gap:32px;justify-content:flex-start"></div>
    </div>
  </section>

  <!-- ================= ABOUT ================= -->
  <section id="about" style="padding:3vh 24px;max-width:100rem;margin:0 auto;height:100vh;height:100dvh;overflow:hidden;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;gap:2.5vh">
    <div id="press-strip" style="display:flex;flex-wrap:wrap;align-items:center;gap:20px 28px"></div>
    <div class="reveal" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:48px;width:100%">
      <div>
        <p style="color:rgba(15,37,26,.68);font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;margin:0 0 10px" data-i18n="about.label"></p>
        <h2 style="font-size:clamp(1.8rem,4.5vh,3.2rem);font-weight:800;letter-spacing:-0.02em;line-height:1.1;margin:0 0 16px">Agriculture<br>+ Grow</h2>
        <p style="font-weight:700;font-size:clamp(0.95rem,1.8vh,1.15rem);color:#0f251a;line-height:1.5;margin:0 0 12px" data-i18n="about.quote"></p>
        <p style="font-size:clamp(0.8rem,1.5vh,0.95rem);color:#525252;line-height:1.55;margin:0 0 8px;max-width:560px" data-i18n="about.p1"></p>
        <p style="font-size:clamp(0.8rem,1.5vh,0.95rem);color:#525252;line-height:1.55;margin:0 0 8px;max-width:560px" data-i18n="about.p2"></p>
        <p style="font-size:clamp(0.8rem,1.5vh,0.95rem);color:#525252;line-height:1.55;margin:0 0 16px;max-width:560px" data-i18n="about.p3"></p>
        <p style="font-weight:700;color:#0f251a;text-align:right;max-width:560px;margin:0 0 20px;font-size:14px" data-i18n="about.signature"></p>
        <div id="about-values" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px"></div>
      </div>

      <div class="photo-slot" data-label="assets/about-photo.jpg" style="position:relative;height:min(70vh, 560px);border-radius:2rem;overflow:hidden">
        <img src="assets/about-photo.jpg" alt="논 현장" onerror="this.parentElement.classList.add('img-missing')">
        <div style="position:absolute;bottom:16px;left:16px;right:16px;padding:18px;background:rgba(255,255,255,.9);backdrop-filter:blur(6px);border-radius:1.25rem;pointer-events:none">
          <p style="color:#0f251a;font-size:clamp(0.85rem,1.6vh,1.05rem);font-weight:500;font-style:italic;line-height:1.4;margin:0" data-i18n="about.photo_quote"></p>
        </div>
      </div>
    </div>
  </section>

  <!-- ================= SOLUTION ================= -->
  <section id="solution" style="padding:3vh 24px;height:100vh;height:100dvh;overflow:hidden;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;background:#0f251a;color:#fff">
   <div style="max-width:100rem;margin:0 auto;width:100%">
    <p style="color:rgba(255,255,255,.65);font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;margin:0 0 10px" data-i18n="solution.label"></p>
    <h2 style="font-size:clamp(1.8rem,4vh,3rem);font-weight:800;letter-spacing:-0.02em;line-height:1.15;margin:0 0 14px;max-width:900px;color:#fff" data-i18n="solution.headline"></h2>
    <p style="font-size:clamp(0.85rem,1.6vh,1.05rem);color:rgba(255,255,255,.7);max-width:760px;line-height:1.6;margin:0 0 28px" data-i18n="solution.sub"></p>
    <div id="solution-cards" class="reveal-stagger" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px"></div>
   </div>
  </section>

  <!-- ================= GLOBAL ================= -->
  <section id="global" style="padding:3vh 24px;background:#f0f4ef;color:#0f251a;height:100vh;height:100dvh;overflow:hidden;box-sizing:border-box;display:flex;align-items:center">
    <div class="reveal" style="max-width:100rem;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:48px;align-items:center;width:100%">
      <div>
        <p style="color:rgba(15,37,26,.68);font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;margin:0 0 10px" data-i18n="global.label"></p>
        <h2 style="font-size:clamp(1.8rem,4.5vh,3.2rem);font-weight:800;letter-spacing:-0.02em;line-height:1.1;margin:0 0 16px"><span data-i18n="global.headline_1"></span><br><span data-i18n="global.headline_2"></span></h2>
        <p style="font-size:clamp(0.85rem,1.7vh,1.05rem);color:#525252;line-height:1.6;margin:0 0 24px;max-width:560px" data-i18n="global.sub"></p>
        <div id="global-handles" class="reveal-stagger" style="display:flex;flex-direction:column;gap:12px"></div>
      </div>
      <div class="photo-slot" data-label="assets/global-photo.webp" style="height:min(70vh,560px);border-radius:2rem;overflow:hidden;position:relative">
        <img src="assets/global-photo.webp" alt="인도네시아 현장" onerror="this.parentElement.classList.add('img-missing')">
      </div>
    </div>
  </section>

  <!-- ================= NEWS ================= -->
  <section id="news" style="padding:3vh 24px;height:100vh;height:100dvh;overflow:hidden;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;background:#0f251a;color:#fff">
   <div style="max-width:100rem;margin:0 auto;width:100%">
    <p style="color:rgba(255,255,255,.65);font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;margin:0 0 10px" data-i18n="news.label"></p>
    <h2 style="font-size:clamp(1.8rem,4vh,3rem);font-weight:800;letter-spacing:-0.02em;line-height:1.15;margin:0 0 12px;color:#fff" data-i18n="news.headline"></h2>
    <p style="font-size:clamp(0.85rem,1.6vh,1.05rem);color:rgba(255,255,255,.7);max-width:760px;line-height:1.6;margin:0 0 20px" data-i18n="news.sub"></p>
    <div id="news-items" class="reveal-stagger"></div>
   </div>
  </section>

  <!-- ================= CONTACT ================= -->
  <section id="contact" style="padding:3vh 24px;max-width:100rem;margin:0 auto;height:100vh;height:100dvh;overflow:hidden;box-sizing:border-box;display:flex;align-items:center">
    <div class="reveal depth-card" style="background:#f0f4ef;border-radius:2.5rem;padding:clamp(24px,4vh,56px);display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:40px;align-items:center;width:100%;max-height:94vh;overflow:hidden">
      <div>
        <h2 style="font-size:clamp(1.8rem,4.5vh,3.2rem);font-weight:800;letter-spacing:-0.02em;line-height:1.05;margin:0 0 16px"><span data-i18n="contact.headline_1"></span><br><span data-i18n="contact.headline_2"></span></h2>
        <p style="font-size:clamp(0.85rem,1.6vh,1.05rem);color:#525252;line-height:1.6;margin:0 0 20px;max-width:460px" data-i18n="contact.sub"></p>
        <div style="display:flex;flex-direction:column;gap:12px">
          <div style="display:flex;align-items:center;gap:12px">
            <div style="width:36px;height:36px;border-radius:999px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.06)">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 6l-10 7L2 6"></path><path d="M2 6h20v12H2z"></path></svg>
            </div>
            <p style="font-size:14px;font-weight:600;margin:0">ceo@a-grow.kr</p>
          </div>
          <div style="display:flex;align-items:center;gap:12px">
            <div style="width:36px;height:36px;border-radius:999px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.06)">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.9v3a2 2 0 01-2.2 2 19.8 19.8 0 01-8.6-3 19.5 19.5 0 01-6-6 19.8 19.8 0 01-3-8.7A2 2 0 014.1 2h3a2 2 0 012 1.7c.1.9.3 1.8.6 2.7a2 2 0 01-.4 2.1L8.1 9.7a16 16 0 006 6l1.2-1.2a2 2 0 012.1-.4c.9.3 1.8.5 2.7.6a2 2 0 011.9 2.2z"></path></svg>
            </div>
            <p style="font-size:14px;font-weight:600;margin:0">+82-33-910-0038</p>
          </div>
        </div>
      </div>

      <form id="contact-form" action="https://formspree.io/f/mzdkanyp" method="POST" target="_blank" style="background:#fff;padding:24px;border-radius:1.75rem;box-shadow:0 20px 50px rgba(15,37,26,.08);border:1px solid rgba(15,37,26,.06);display:flex;flex-direction:column;gap:12px">
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px">
          <div>
            <label style="display:block;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#a3a3a3;margin-bottom:5px"><span data-i18n="contact.label_name"></span> *</label>
            <input type="text" name="name" required style="width:100%;padding:10px 14px;background:#f7f8f6;border:none;border-radius:0.7rem;font-size:13px">
          </div>
          <div>
            <label style="display:block;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#a3a3a3;margin-bottom:5px" data-i18n="contact.label_company"></label>
            <input type="text" name="company" style="width:100%;padding:10px 14px;background:#f7f8f6;border:none;border-radius:0.7rem;font-size:13px">
          </div>
        </div>
        <div>
          <label style="display:block;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#a3a3a3;margin-bottom:5px"><span data-i18n="contact.label_email"></span> *</label>
          <input type="email" name="email" required style="width:100%;padding:10px 14px;background:#f7f8f6;border:none;border-radius:0.7rem;font-size:13px">
        </div>
        <div>
          <label style="display:block;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#a3a3a3;margin-bottom:5px"><span data-i18n="contact.label_inquiry_type"></span> *</label>
          <select name="inquiry_type" required id="inquiry-select" style="width:100%;padding:10px 14px;background:#f7f8f6;border:none;border-radius:0.7rem;font-size:13px;color:#0f251a"></select>
        </div>
        <div>
          <label style="display:block;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#a3a3a3;margin-bottom:5px"><span data-i18n="contact.label_message"></span> *</label>
          <textarea name="message" rows="2" required style="width:100%;padding:10px 14px;background:#f7f8f6;border:none;border-radius:0.7rem;font-size:13px;resize:none"></textarea>
        </div>
        <label style="display:flex;align-items:flex-start;gap:8px;font-size:11px;color:#525252;line-height:1.4">
          <input type="checkbox" id="consent-checkbox" name="consent" style="margin-top:2px">
          <span><span data-i18n="contact.consent_text"></span> <a href="javascript:void(0)" id="open-privacy-link" style="color:#0f251a;font-weight:600;text-decoration:underline" data-i18n="contact.consent_link"></a></span>
        </label>
        <button type="submit" id="submit-btn" class="btn-primary" disabled style="width:100%;padding:20px;border:none;border-radius:1rem;font-weight:700;font-size:17px;transition:background .2s;background:#c9cfc5;color:#fff;cursor:not-allowed" data-i18n="contact.submit"></button>
      </form>
    </div>
  </section>
  </main>

        <span style="padding:4px 14px;background:rgba(255,255,255,.1);border-radius:999px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#fff">${m.category === 'global' ? T.news.category_global : T.news.category_domestic}</span>
      </div>
      <h3 style="font-size:clamp(15px,2vh,20px);font-weight:700;letter-spacing:-0.01em;margin:0;flex:1;min-width:260px;color:#fff">${esc(T.news.titles[i])}</h3>
      <div style="width:36px;height:36px;border-radius:999px;border:1px solid rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;flex-shrink:0">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M7 17L17 7M7 7h10v10"></path></svg>
      </div>
    </a>`).join('');

  document.getElementById('inquiry-select').innerHTML = T.contact.inquiry_options.map(opt => `<option value="${esc(opt)}">${esc(opt)}</option>`).join('');

  renderDotNav();
  updateNavColors();
  observeReveals();
}

// ===================================================================
// Section dot navigation
// ===================================================================
function sectionLabel(id) {
  const T = t();
  const map = { about: T.nav.about, solution: T.nav.solution, global: T.nav.global, news: T.nav.news, contact: T.nav.contact };
  if (map[id]) return map[id];
  const extra = {
    ko: { hero: '홈', footer: '푸터' },
    en: { hero: 'Home', footer: 'Footer' },
    id: { hero: 'Beranda', footer: 'Footer' },
  };
  return extra[state.lang][id];
}

function renderDotNav() {
  const nav = document.getElementById('dot-nav');
  nav.innerHTML = SECTION_IDS.map((id, i) => `
    <button data-index="${i}" aria-label="${esc(sectionLabel(id))}" aria-current="${i === state.sectionIndex ? 'true' : 'false'}" title="${esc(sectionLabel(id))}">
      <span class="dot"></span>
    </button>`).join('');
  nav.querySelectorAll('button').forEach(btn => btn.addEventListener('click', () => goToSection(Number(btn.dataset.index))));
}

// ===================================================================
// Scroll-reveal via IntersectionObserver
// ===================================================================
const revealObserver = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      entry.target.classList.add('is-visible');
      revealObserver.unobserve(entry.target);
    }
  });
}, { root: document.getElementById('root'), threshold: 0.15 });

function observeReveals() {
  document.querySelectorAll('.reveal:not([data-observed]), .reveal-stagger:not([data-observed])').forEach(el => {
    el.dataset.observed = '1';
    revealObserver.observe(el);
  });
}

// ===================================================================
// Targeted updates (do NOT rebuild the whole page — avoid wiping form input)
// ===================================================================
function updateNavColors() {
  const onDark = DARK_SECTION_IDS.includes(SECTION_IDS[state.sectionIndex]);
  const navColor = onDark ? '#fff' : '#0f251a';
  const navHoverBg = onDark ? 'rgba(255,255,255,.15)' : 'rgba(15,37,26,.08)';
  document.getElementById('logo-img').style.filter = onDark ? 'brightness(0) invert(1)' : 'none';
  document.querySelectorAll('.nav-link').forEach(a => {
    a.style.color = navColor;
    a.onmouseenter = () => a.style.background = navHoverBg;
    a.onmouseleave = () => a.style.background = 'transparent';
  });
  const langBox = document.getElementById('lang-box');
  langBox.style.background = onDark ? 'rgba(255,255,255,.1)' : 'rgba(15,37,26,.06)';
  langBox.style.border = `1px solid ${onDark ? 'rgba(255,255,255,.3)' : 'rgba(15,37,26,.15)'}`;
  document.querySelectorAll('.lang-option').forEach(btn => {
    const active = btn.dataset.code === state.lang;
    btn.style.background = active ? '#fff' : 'transparent';
    btn.style.color = active ? '#0f251a' : (onDark ? 'rgba(255,255,255,.6)' : 'rgba(15,37,26,.5)');
  });

  const dotNav = document.getElementById('dot-nav');
  dotNav.classList.toggle('on-dark', onDark);
  dotNav.querySelectorAll('button').forEach(btn => {
    btn.setAttribute('aria-current', Number(btn.dataset.index) === state.sectionIndex ? 'true' : 'false');
  });

  const topbar = document.getElementById('topbar');
  topbar.classList.toggle('scrolled', state.sectionIndex > 0);
  topbar.classList.toggle('on-dark', onDark);

  const progress = document.getElementById('scroll-progress');
  progress.style.width = (state.sectionIndex / (SECTION_IDS.length - 1) * 100) + '%';
  progress.style.background = onDark ? '#fff' : '#0f251a';
}

function updateSubmitButton() {
  const consent = document.getElementById('consent-checkbox').checked;
  const btn = document.getElementById('submit-btn');
  btn.disabled = !consent;
  btn.style.background = consent ? '#0f251a' : '#c9cfc5';
  btn.style.cursor = consent ? 'pointer' : 'not-allowed';
}

function setLang(lang) {
  state.lang = lang;
  document.documentElement.lang = lang;
  renderPage();
}

// ===================================================================
// Modal focus management (shared)
// ===================================================================
let lastFocusedEl = null;

function focusablesIn(container) {
  return Array.from(container.querySelectorAll('a[href], button:not([disabled]), input:not([disabled]), textarea:not([disabled]), select:not([disabled]), [tabindex]:not([tabindex="-1"])'));
}

function openModal(modalEl, triggerEl) {
  lastFocusedEl = triggerEl || document.activeElement;
  modalEl.style.display = 'flex';
  const focusables = focusablesIn(modalEl);
  (focusables[0] || modalEl).focus();

  function onKeydown(e) {
    if (e.key === 'Escape') {
      e.preventDefault();
      closeModal(modalEl);
      return;
    }
    if (e.key === 'Tab') {
      const items = focusablesIn(modalEl);
      if (items.length === 0) return;
      const first = items[0], last = items[items.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  }
  modalEl._keydownHandler = onKeydown;
  modalEl.addEventListener('keydown', onKeydown);
}

function closeModal(modalEl) {
  modalEl.style.display = 'none';
  if (modalEl._keydownHandler) modalEl.removeEventListener('keydown', modalEl._keydownHandler);
  if (lastFocusedEl && typeof lastFocusedEl.focus === 'function') lastFocusedEl.focus();
}

// ===================================================================
// Solution modal
// ===================================================================
function openSolutionModal(index, triggerEl) {
  const card = t().solution.cards[index];
  const T = t();
  document.getElementById('solution-modal-img').src = `assets/${card.imgId}-modal.webp`;
  document.getElementById('solution-modal-photo').classList.remove('img-missing');
  document.getElementById('solution-modal-photo').setAttribute('data-label', `assets/${card.imgId}-modal.webp`);
  document.getElementById('solution-modal-label').textContent = T.solution.detail_label;
  document.getElementById('solution-modal-title').textContent = card.title;
  document.getElementById('solution-modal-detail').textContent = card.detail;
  document.getElementById('solution-modal-tags').innerHTML = card.tags.map(tag =>
    `<span style="padding:6px 14px;background:rgba(255,255,255,.18);backdrop-filter:blur(2px);border-radius:999px;font-size:12px;color:#fff;font-weight:500">${esc(tag)}</span>`).join('');
  openModal(document.getElementById('solution-modal'), triggerEl);
}
function closeSolutionModal() { closeModal(document.getElementById('solution-modal')); }

// ===================================================================
// Policy modal
// ===================================================================
function openPolicyModal(kind, triggerEl) {
  const p = t().policy[kind];
  document.getElementById('policy-modal-title').textContent = p.title;
  document.getElementById('policy-modal-sections').innerHTML = p.sections.map(sec => `
    <div style="margin-bottom:18px">
      <h4 style="font-size:15px;font-weight:700;margin:0 0 6px;color:#0f251a">${esc(sec.heading)}</h4>
      <p style="font-size:14px;color:#525252;line-height:1.7;margin:0">${esc(sec.body)}</p>
    </div>`).join('');
  openModal(document.getElementById('policy-modal'), triggerEl);
}
function closePolicyModal() { closeModal(document.getElementById('policy-modal')); }

// ===================================================================
// Scroll / wheel / touch section paging
// ===================================================================
(function initScrolling() {
  const root = document.getElementById('root');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let isAnimating = false;
  let wheelLock = null;

  function goTo(next) {
    next = Math.min(Math.max(next, 0), SECTION_IDS.length - 1);
    if (next === state.sectionIndex) return;
    isAnimating = true;
    root.scrollTo({ top: next * window.innerHeight, behavior: reduceMotion ? 'auto' : 'smooth' });
    state.sectionIndex = next;
    updateNavColors();
    clearTimeout(wheelLock);
    wheelLock = setTimeout(() => { isAnimating = false; }, reduceMotion ? 0 : 700);
  }

  root.addEventListener('scroll', () => {
    if (isAnimating) return;
    const idx = Math.round(root.scrollTop / window.innerHeight);
    if (idx !== state.sectionIndex) { state.sectionIndex = idx; updateNavColors(); }
  });

  // Reduced motion: let the user scroll normally, skip wheel/touch section-jacking entirely.
  if (!reduceMotion) {
    root.addEventListener('wheel', (e) => {
      // Any modal open: let its own content (e.g. long policy text) scroll normally.
      if (document.getElementById('solution-modal').style.display === 'flex' ||
          document.getElementById('policy-modal').style.display === 'flex') return;
      e.preventDefault();
      if (isAnimating) return;
      goTo(state.sectionIndex + (e.deltaY > 0 ? 1 : -1));
    }, { passive: false });

    let touchStartY = 0;
    root.addEventListener('touchstart', (e) => { touchStartY = e.touches[0].clientY; }, { passive: true });
    root.addEventListener('touchmove', (e) => {
      if (document.getElementById('solution-modal').style.display === 'flex' ||
          document.getElementById('policy-modal').style.display === 'flex') return;
      e.preventDefault();
    }, { passive: false });
    root.addEventListener('touchend', (e) => {
      if (isAnimating) return;
      if (document.getElementById('solution-modal').style.display === 'flex' ||
          document.getElementById('policy-modal').style.display === 'flex') return;
      const deltaY = touchStartY - e.changedTouches[0].clientY;
      if (Math.abs(deltaY) < 40) return;
      goTo(state.sectionIndex + (deltaY > 0 ? 1 : -1));
    }, { passive: true });
  }

  // Keyboard section navigation (skip while typing in a form field or while a modal is open)
  window.addEventListener('keydown', (e) => {
    const tag = document.activeElement && document.activeElement.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
    if (document.getElementById('solution-modal').style.display === 'flex' ||
        document.getElementById('policy-modal').style.display === 'flex') return;
    if (isAnimating) return;
    if (e.key === 'ArrowDown' || e.key === 'PageDown') { e.preventDefault(); goTo(state.sectionIndex + 1); }
    else if (e.key === 'ArrowUp' || e.key === 'PageUp') { e.preventDefault(); goTo(state.sectionIndex - 1); }
    else if (e.key === 'Home') { e.preventDefault(); goTo(0); }
    else if (e.key === 'End') { e.preventDefault(); goTo(SECTION_IDS.length - 1); }
  });

  document.getElementById('logo-link').addEventListener('click', () => goTo(0));
  window.goToSection = goTo;
})();

// ===================================================================
// Static event wiring
// ===================================================================
document.getElementById('consent-checkbox').addEventListener('change', updateSubmitButton);
document.getElementById('open-privacy-link').addEventListener('click', (e) => openPolicyModal('privacy', e.currentTarget));
document.getElementById('open-privacy-footer').addEventListener('click', (e) => openPolicyModal('privacy', e.currentTarget));
document.getElementById('open-terms-footer').addEventListener('click', (e) => openPolicyModal('terms', e.currentTarget));
document.getElementById('solution-modal-close').addEventListener('click', closeSolutionModal);
document.getElementById('solution-modal-backdrop').addEventListener('click', closeSolutionModal);
document.getElementById('policy-modal-close').addEventListener('click', closePolicyModal);
document.getElementById('policy-modal-backdrop').addEventListener('click', closePolicyModal);

// Submit loading feedback (form still opens Formspree in a new tab via target="_blank")
document.getElementById('contact-form').addEventListener('submit', () => {
  const btn = document.getElementById('submit-btn');
  const original = btn.textContent;
  btn.textContent = state.lang === 'ko' ? '전송 중…' : state.lang === 'id' ? 'Mengirim…' : 'Sending…';
  btn.disabled = true;
  setTimeout(() => { btn.textContent = original; updateSubmitButton(); }, 2500);
});

renderPage();
updateSubmitButton();
</script>
